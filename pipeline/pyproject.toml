[project]
name = "capital-atlas-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "python-slugify>=9.1.3",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
